[project]
name = "inilora-adaptive-rank-study"
version = "0.1.0"
description = "Neutral controlled study of centered initialization and adaptive rank budgets"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.16.0.dev20261013+cu130",
  "triton==3.9.0+gitfc8d31a5",
  "transformers==5.19.0", "peft==0.21.2", "datasets==5.1.0",
  "safetensors==0.8.0", "accelerate==1.15.0", "huggingface-hub==2.2.0",
  "pytest==9.1.1", "numpy==2.5.4", "scipy==1.18.1", "matplotlib==3.11.2",
  "pyarrow==26.0.0", "pandas==3.0.6", "pyyaml==6.0.3", "tensorboard==2.21.0",
  "sympy==1.14.0", "psutil==7.2.2"
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "torch-nightly-cu130"
url = "https://download.pytorch.org/whl/nightly/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "torch-nightly-cu130" }
triton = { index = "torch-nightly-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
